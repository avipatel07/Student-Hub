<main>

    <div class="container">

        <div class="page-title">

            <h2>Campus Events</h2>

            <p>
                Discover upcoming events and activities at StudentHub
            </p>

        </div>


        <!-- ================= CONTROLS ================= -->

        <section class="event-controls">

            <div class="search-box">

                <label for="eventSearch">
                    Search Events
                </label>

                <input
                    type="search"
                    id="eventSearch"
                    placeholder="Search by event name, category or location..."
                >

            </div>


            <div class="filter-box">

                <label for="eventCategory">
                    Category
                </label>

                <select id="eventCategory">

                    <option value="all">
                        All Categories
                    </option>

                    <option value="Technology">
                        Technology
                    </option>

                    <option value="Competition">
                        Competition
                    </option>

                    <option value="Workshop">
                        Workshop
                    </option>

                    <option value="Sports">
                        Sports
                    </option>

                    <option value="Cultural">
                        Cultural
                    </option>

                    <option value="Career">
                        Career
                    </option>

                </select>

            </div>


            <div class="sort-box">

                <label for="eventSort">
                    Sort By
                </label>

                <select id="eventSort">

                    <option value="dateAsc">
                        Date: Earliest First
                    </option>

                    <option value="dateDesc">
                        Date: Latest First
                    </option>

                    <option value="nameAsc">
                        Name: A - Z
                    </option>

                    <option value="nameDesc">
                        Name: Z - A
                    </option>

                </select>

            </div>

        </section>


        <!-- ================= STATUS ================= -->

        <div
            id="eventStatus"
            class="event-status"
            aria-live="polite">

            Loading events...

        </div>


        <!-- ================= EVENTS ================= -->

        <section
            id="eventList"
            class="event-grid">

        </section>


        <!-- ================= PAGINATION ================= -->

        <div
            id="eventPagination"
            class="pagination">

        </div>

    </div>

</main>
